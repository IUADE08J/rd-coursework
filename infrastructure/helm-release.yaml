apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wildfly-operator
  namespace: wildfly-operator
spec:
#  applicationImage: "demo.goharbor.io/beigelzimer/coursework-wildfly:v1.0"
  interval: 2m
  releaseName: wildfly-operator
  chart:
    spec:
      chart: wildfly
      version: "1.1.3"
      sourceRef:
        kind: HelmRepository
        name: wildfly
        namespace: flux-system

  install:
    createNamespace: true
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    image:
      repository: quay.io/wildfly/wildfly-operator
      tag: "1.1.3"
      pullPolicy: IfNotPresent
#    watchNamespaces:
#      - wildfly-apps

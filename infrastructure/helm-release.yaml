apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wildfly-operator
  namespace: wildfly-operator
spec:
  interval: 2m
  releaseName: wildfly-operator
  chart:
    spec:
      chart: wildfly-operator
      version: "1.1.3"
      sourceRef:
        kind: HelmRepository
        name: wildfly
        namespace: flux-system
  install:
    createNamespace: true
  upgrade:
    crds: CreateReplace
  values:
    watchNamespaces:
      - wildfly-apps
